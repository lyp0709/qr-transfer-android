<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机端数据解码器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .input-section {
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 16px;
            font-family: monospace;
            resize: vertical;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .add-btn {
            background: #4CAF50;
            color: white;
        }

        .decode-btn {
            background: #667eea;
            color: white;
        }

        .clear-btn {
            background: #ff6b6b;
            color: white;
        }

        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .data-list {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: white;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }

        .data-item:last-child {
            margin-bottom: 0;
        }

        .download-btn {
            background: #28a745;
            color: white;
            width: 100%;
        }

        .instructions {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            font-size: 14px;
        }

        .instructions h3 {
            color: #856404;
            margin-bottom: 10px;
        }

        .instructions ol {
            margin-left: 20px;
            color: #856404;
        }

        .instructions li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 手机端数据解码器</h1>
        
        <div class="instructions">
            <h3>📋 使用说明</h3>
            <ol>
                <li>用任意二维码扫描器扫描电脑上的二维码</li>
                <li>复制扫描到的文本，粘贴到下方输入框</li>
                <li>点击"添加数据块"按钮</li>
                <li>重复上述步骤，直到扫描完所有二维码</li>
                <li>点击"解码并下载文件"按钮</li>
            </ol>
        </div>

        <div class="input-section">
            <textarea id="dataInput" placeholder="粘贴扫描到的二维码内容..."></textarea>
        </div>

        <div class="button-group">
            <button class="add-btn" onclick="addDataBlock()">➕ 添加数据块</button>
            <button class="decode-btn" onclick="decodeAndDownload()">🔓 解码并下载</button>
            <button class="clear-btn" onclick="clearAll()">🗑️ 清除</button>
        </div>

        <div class="status" id="status" style="display: none;"></div>

        <div class="data-list">
            <h3>已添加的数据块：<span id="dataCount">0</span></h3>
            <div id="dataItems"></div>
        </div>
    </div>

    <script>
        let dataBlocks = [];
        let expectedTotal = 0;

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
            
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        }

        function addDataBlock() {
            const input = document.getElementById('dataInput');
            const data = input.value.trim();
            
            if (!data) {
                showStatus('请输入数据', 'error');
                return;
            }

            // 解析格式：序号/总数|数据
            const match = data.match(/^(\d+)\/(\d+)\|(.+)$/);
            if (!match) {
                showStatus('数据格式错误', 'error');
                return;
            }

            const index = parseInt(match[1]) - 1; // 转换为0-based
            const total = parseInt(match[2]);
            const content = match[3];

            // 设置预期总数
            if (expectedTotal === 0) {
                expectedTotal = total;
            } else if (expectedTotal !== total) {
                showStatus('数据总数不一致', 'error');
                return;
            }

            // 检查是否已存在
            if (dataBlocks[index] !== undefined) {
                showStatus(`数据块 ${index + 1} 已存在`, 'info');
                return;
            }

            // 添加数据块
            dataBlocks[index] = content;
            input.value = '';
            
            updateDataList();
            showStatus(`成功添加数据块 ${index + 1}/${total}`, 'success');
        }

        function updateDataList() {
            const container = document.getElementById('dataItems');
            const count = document.getElementById('dataCount');
            
            container.innerHTML = '';
            
            let addedCount = 0;
            dataBlocks.forEach((data, index) => {
                if (data !== undefined) {
                    addedCount++;
                    const item = document.createElement('div');
                    item.className = 'data-item';
                    item.innerHTML = `
                        <span>数据块 ${index + 1}</span>
                        <span style="color: #4CAF50;">✓</span>
                    `;
                    container.appendChild(item);
                }
            });

            count.textContent = addedCount;

            if (expectedTotal > 0) {
                count.textContent += ` / ${expectedTotal}`;
            }
        }

        function decodeAndDownload() {
            if (dataBlocks.length === 0) {
                showStatus('没有数据块', 'error');
                return;
            }

            // 检查是否完整
            const missingBlocks = [];
            for (let i = 0; i < expectedTotal; i++) {
                if (dataBlocks[i] === undefined) {
                    missingBlocks.push(i + 1);
                }
            }

            if (missingBlocks.length > 0) {
                showStatus(`缺少数据块: ${missingBlocks.join(', ')}`, 'error');
                return;
            }

            try {
                // 合并所有数据块
                const combinedData = dataBlocks.join('');
                
                // Base64解码
                const binaryString = atob(combinedData);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                // 创建Blob并下载
                const blob = new Blob([bytes], { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'decoded_file.zip';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                showStatus('文件解码成功，正在下载...', 'success');
            } catch (error) {
                showStatus(`解码失败: ${error.message}`, 'error');
}
        }

        function clearAll() {
            dataBlocks = [];
            expectedTotal = 0;
            document.getElementById('dataInput').value = '';
            updateDataList();
            showStatus('已清除所有数据', 'info');
        }
    </script>
</body>
</html>
